name: EAS Build

# Trigger handmatig vanuit de Actions tab, met keuze platform en profiel.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform om te bouwen'
        required: true
        type: choice
        default: 'android'
        options:
          - android
          - ios
          - all
      profile:
        description: 'Build profiel'
        required: true
        type: choice
        default: 'production'
        options:
          - development
          - preview
          - production

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.platform }} / ${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build on EAS
        run: eas build --platform ${{ github.event.inputs.platform }} --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait
