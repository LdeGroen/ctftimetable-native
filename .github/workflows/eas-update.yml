name: EAS OTA Update

# Trigger handmatig — voor het pushen van JS-wijzigingen zonder nieuwe store build.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Update kanaal'
        required: true
        type: choice
        default: 'production'
        options:
          - preview
          - production
      message:
        description: 'Update bericht (changelog)'
        required: true
        type: string

jobs:
  update:
    name: Publish OTA update to ${{ github.event.inputs.branch }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Invoer via env en niet in het script geplakt: anders is vrije tekst in
      # 'message' uitvoerbare shell (audit INF-12).
      - name: Publish update
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          MESSAGE: ${{ github.event.inputs.message }}
        run: eas update --branch "$BRANCH" --message "$MESSAGE" --non-interactive
